name: Release

# Publishes a release for the mod_version in gradle.properties whenever main is
# pushed and that version has no release yet. Bump mod_version to release again.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "tag=v$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Check for existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.exists.outputs.found == 'false'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.exists.outputs.found == 'false'
      - name: Build
        if: steps.exists.outputs.found == 'false'
        run: ./gradlew build
      - name: Publish GitHub release
        if: steps.exists.outputs.found == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: StickyToggle ${{ steps.version.outputs.tag }} (Minecraft 1.21.11)
          files: build/libs/stickytoggle-*[0-9].jar
          body: |
            StickyToggle for **Minecraft Java 1.21.11** (Fabric).

            Each player can choose how slime and honey blocks affect their own movement:
            - `/stickytoggle slime on|off`: bounce, walk slowdown, slipperiness
            - `/stickytoggle honey on|off`: speed slowdown, jump reduction, wall slide
            - `/stickytoggle all on|off`: slime and honey together

            Works for every player, no op needed, and only changes the player who runs it. Fall damage, mobs, items and mechanics stay vanilla.

            **Install on both server and client**, together with Fabric API (0.141.6+1.21.11) and Fabric Loader 0.19.5 or newer. Requires Java 21.
