plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'com.modrinth.minotaur' version '2.10.0'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "stickytoggle" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // MixinExtras is bundled with Fabric Loader, no extra dependency needed.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// In-game client tests (src/gametest), run with ./gradlew runClientGameTest. Not part of the mod jar.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'stickytoggle-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// Modrinth upload: `./gradlew modrinth` with the MODRINTH_TOKEN environment variable set (a Modrinth token with the
// CREATE_VERSION scope). Changelog text comes from -Pchangelog="..."; add -PmodrinthDryRun to print the upload
// without sending it. Fails if this version number is already on Modrinth.
modrinth {
    projectId = project.modrinth_project
    versionNumber = project.mod_version
    versionName = "StickyToggle ${project.mod_version}"
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = ['fabric']
    changelog = project.findProperty('changelog') ?: "StickyToggle ${project.mod_version}"
    debugMode = project.hasProperty('modrinthDryRun')
    dependencies {
        required.project 'fabric-api'
    }
}
