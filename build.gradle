plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'com.modrinth.minotaur' version '2.10.0'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "stickytoggle" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases' }
    // Alloy UI (theme + widget toolkit): ./gradlew publishToMavenLocal in ../alloy-ui
    mavenLocal {
        content { includeModule 'dev.steelaspect', 'alloy-ui' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // MixinExtras is bundled with Fabric Loader, no extra dependency needed.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional client integrations: the config menu needs MaLiLib, the Mod Menu button needs Mod Menu.
    // Neither is bundled or required; without them the mod still works (commands only).
    // -PwithoutMalilib keeps MaLiLib off the runtime classpath, to check the client still starts without it.
    if (project.hasProperty('withoutMalilib')) {
        modCompileOnly "maven.modrinth:malilib:${project.malilib_modrinth_id}"
    } else {
        modImplementation "maven.modrinth:malilib:${project.malilib_modrinth_id}"
    }
    // (Mod Menu 9.2.0 pulls a placeholder-api build no repo serves, hence transitive = false)
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

    // Nocturne settings screen (client code only), bundled jar-in-jar.
    modImplementation "dev.steelaspect:alloy-ui:${project.alloyui_version}"
    include "dev.steelaspect:alloy-ui:${project.alloyui_version}"

    // Optional Alloy Hub page: compile-only, loaded only when the Hub is installed. -PwithHub adds it to dev runs/tests.
    modCompileOnly fileTree(dir: 'libs', include: 'alloy-hub-*.jar')
    if (project.hasProperty('withHub')) {
        modLocalRuntime fileTree(dir: 'libs', include: 'alloy-hub-*.jar')
    }
}

// MaLiLib ships conditional-mixin as a jar-in-jar. Loom doesn't unpack nested jars of Maven mods for
// dev runs, so MaLiLib's own copy is extracted onto the local runtime classpath (runClient / tests only;
// never part of this mod's jar or metadata).
configurations {
    malilibArtifact { transitive = false }
}
dependencies {
    malilibArtifact "maven.modrinth:malilib:${project.malilib_modrinth_id}"
}
def malilibNestedJar = layout.buildDirectory.file('malilib-nested/conditional-mixin-fabric.jar').get().asFile
if (!malilibNestedJar.exists()) {
    new java.util.zip.ZipFile(configurations.malilibArtifact.singleFile).withCloseable { zip ->
        def entry = zip.entries().find { it.name.startsWith('META-INF/jars/conditional-mixin') }
        if (entry != null) {
            malilibNestedJar.parentFile.mkdirs()
            malilibNestedJar.bytes = zip.getInputStream(entry).bytes
        }
    }
}
dependencies {
    if (malilibNestedJar.exists()) {
        modLocalRuntime files(malilibNestedJar)
    }
}

// Client game tests need fabric-client-gametest-api-v1 (1.21.4+): not built on 1.20.4. Instead, src/smoketest is a
// small client mod run by ./smoketest.sh (through ./headless.sh): it joins a dedicated 1.20.4 server running the
// built jar, walks every block with the toggles on and off, uses the screens and hotkeys, then joins a server
// without the mod. Logs [StickySmoke] PASS/FAIL.
sourceSets {
    smoketest {
        compileClasspath += main.compileClasspath + main.output + client.compileClasspath + client.output
        runtimeClasspath += main.runtimeClasspath + main.output + client.runtimeClasspath + client.output
    }
}

loom {
    mods {
        'stickytoggle-smoke' { sourceSet sourceSets.smoketest }
    }
    runs {
        smokeTest {
            client()
            name 'Smoke test'
            source sourceSets.smoketest
            runDir 'build/run/smoke'
            vmArg '-Dstickytoggle.smoke=true'
            programArgs '--username', 'StickySmoke'
            ideConfigGenerated false
        }
    }
}

// Test games start muted (and don't pause when the headless window has no focus).
tasks.matching { it.name == 'runSmokeTest' || it.name == 'runClient' }.configureEach {
    doFirst {
        def options = file(it.name == 'runClient' ? 'run/options.txt' : 'build/run/smoke/options.txt')
        options.parentFile.mkdirs()
        def keys = ['soundCategory_master:', 'pauseOnLostFocus:', 'tutorialStep:', 'autoJump:']
        def lines = options.exists() ? options.readLines().findAll { l -> !keys.any { l.startsWith(it) } } : []
        options.text = (lines + ['soundCategory_master:0.0', 'pauseOnLostFocus:false', 'tutorialStep:none', 'autoJump:false']).join('\n') + '\n'
    }
}

processResources {
    def props = [version: project.version, malilib_version: project.malilib_version]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// Modrinth upload: `./gradlew modrinth` with the MODRINTH_TOKEN environment variable set (a Modrinth token with the
// CREATE_VERSION scope). Changelog text comes from -Pchangelog="..."; add -PmodrinthDryRun to print the upload
// without sending it. Fails if this version number is already on Modrinth.
modrinth {
    projectId = project.modrinth_project
    versionNumber = project.mod_version
    versionName = "Alloy Sticky Toggle ${project.mod_version}"
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = ['fabric']
    changelog = project.findProperty('changelog') ?: "Alloy Sticky Toggle ${project.mod_version}"
    debugMode = project.hasProperty('modrinthDryRun')
    dependencies {
        required.project 'fabric-api'
    }
}
